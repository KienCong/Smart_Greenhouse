[platformio]
build_dir = C:/Users/miku1/.pio_builds/esp32_gateway

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor
monitor_speed = 115200

; Upload firmware
upload_speed = 921600

; Libraries
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.4.2

; Debug level
build_unflags =
    -DCORE_DEBUG_LEVEL=0
build_flags =
    -DCORE_DEBUG_LEVEL=3

